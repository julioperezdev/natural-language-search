spring.application.name=nls
spring.datasource.url=${NLS_DB_URL:jdbc:postgresql://localhost:5432/nls}
spring.datasource.username=${NLS_DB_USERNAME:nls}
spring.datasource.password=${NLS_DB_PASSWORD:nls}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${NLS_DB_SCHEMA:nls}
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${NLS_DB_SCHEMA:nls}
spring.liquibase.liquibase-schema=${NLS_DB_SCHEMA:nls}
nls.aws.region=${NLS_AWS_REGION:us-east-1}
nls.database.secret-id=${NLS_DB_SECRET_ID:wcs/prod/database}
nls.database.schema=${NLS_DB_SCHEMA:nls}
springdoc.api-docs.enabled=${NLS_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${NLS_SWAGGER_ENABLED:true}
nls.search.interpretation.typesafe.endpoint=${NLS_TYPESAFE_ENDPOINT:https://api.typesafe.ai}
nls.search.interpretation.typesafe.model=${NLS_TYPESAFE_MODEL:jev-1.13.0}
nls.search.interpretation.typesafe.secret-id=${NLS_TYPESAFE_SECRET_ID:wcs/prod/typesafe}
nls.search.interpretation.typesafe.request-timeout=${NLS_TYPESAFE_REQUEST_TIMEOUT:5s}
nls.search.interpretation.typesafe.minimum-confidence=${NLS_TYPESAFE_MINIMUM_CONFIDENCE:0.65}
