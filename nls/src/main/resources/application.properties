spring.config.import=optional:classpath:/application-local.properties
spring.application.name=nls
spring.datasource.url=${NLS_DB_URL:jdbc:postgresql://localhost:5432/nls}
spring.datasource.username=${NLS_DB_USERNAME:nls}
spring.datasource.password=${NLS_DB_PASSWORD:nls}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${NLS_DB_SCHEMA:nls}
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${NLS_DB_SCHEMA:nls}
spring.liquibase.liquibase-schema=${NLS_DB_SCHEMA:nls}
nls.aws.region=${NLS_AWS_REGION:us-east-1}
nls.database.secret-id=${NLS_DB_SECRET_ID:wcs/prod/database}
nls.database.schema=${NLS_DB_SCHEMA:nls}
springdoc.api-docs.enabled=${NLS_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${NLS_SWAGGER_ENABLED:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
nls.search.interpretation.typesafe.endpoint=${NLS_TYPESAFE_ENDPOINT:https://api.typesafe.ai}
nls.search.interpretation.typesafe.model=${NLS_TYPESAFE_MODEL:jev-1.13.0}
nls.search.interpretation.typesafe.secret-id=${NLS_TYPESAFE_SECRET_ID:wcs/prod/typesafe}
nls.search.interpretation.typesafe.request-timeout=${NLS_TYPESAFE_REQUEST_TIMEOUT:5s}
nls.search.interpretation.typesafe.minimum-confidence=${NLS_TYPESAFE_MINIMUM_CONFIDENCE:0.65}
nls.conversation.identity-hmac-key=${NLS_CONVERSATION_IDENTITY_HMAC_KEY:}
nls.build.revision=${NLS_BUILD_REVISION:unknown}
nls.evaluation.enabled=false
nls.evaluation.corpus-location=classpath:evaluation/catalog-conversation-v1.1.1.json
nls.evaluation.catalog-fixture-location=classpath:evaluation/catalog-conversation-seed-v1.1.0.sql
nls.evaluation.worker-threads=1
nls.evaluation.queue-capacity=2
nls.evaluation.allowed-database-hosts=localhost,127.0.0.1,::1
nls.whatsapp.enabled=${NLS_WHATSAPP_ENABLED:false}
nls.whatsapp.secret-id=${NLS_WHATSAPP_SECRET_ID:nls/prod/whatsapp}
nls.whatsapp.graph-api-base-url=${NLS_WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com}
nls.whatsapp.graph-api-version=${NLS_WHATSAPP_GRAPH_API_VERSION:v25.0}
nls.whatsapp.business-account-id=${NLS_WHATSAPP_BUSINESS_ACCOUNT_ID:}
nls.whatsapp.phone-number-id=${NLS_WHATSAPP_PHONE_NUMBER_ID:}
nls.whatsapp.allowed-recipient=${NLS_WHATSAPP_ALLOWED_RECIPIENT:}
nls.whatsapp.connect-timeout=${NLS_WHATSAPP_CONNECT_TIMEOUT:2s}
nls.whatsapp.read-timeout=${NLS_WHATSAPP_READ_TIMEOUT:5s}
