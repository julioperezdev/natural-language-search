databaseChangeLog:
  - changeSet:
      id: 003-create-evaluation-runs
      author: natural-language-search
      changes:
        - createTable:
            tableName: evaluation_runs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_evaluation_runs
                    nullable: false
              - column:
                  name: suite_id
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: corpus_version
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
              - column:
                  name: model_id
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: application_revision
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: finished_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: case_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: passed_case_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: failed_case_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: report_json
                  type: TEXT
              - column:
                  name: failure_code
                  type: VARCHAR(80)
        - createIndex:
            tableName: evaluation_runs
            indexName: idx_evaluation_runs_created_at
            columns:
              - column:
                  name: created_at
                  descending: true
      rollback:
        - dropTable:
            tableName: evaluation_runs
