databaseChangeLog:
  - changeSet:
      id: 001-create-product-catalog
      author: natural-language-search
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_categories_name
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(240)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_products_category
                    references: categories(id)
        - createTable:
            tableName: product_variants
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_product_variants
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_variants_product
                    references: products(id)
              - column:
                  name: color
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: stock
                  type: INT
                  constraints:
                    nullable: false
        - createIndex:
            tableName: products
            indexName: idx_products_category
            columns:
              - column:
                  name: category_id
        - createIndex:
            tableName: product_variants
            indexName: idx_variants_product
            columns:
              - column:
                  name: product_id
        - createIndex:
            tableName: product_variants
            indexName: idx_variants_color_size
            columns:
              - column:
                  name: color
              - column:
                  name: size
